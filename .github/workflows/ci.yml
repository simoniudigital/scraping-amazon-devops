# Integración continua: cada push y cada pull request se revisan con el linter y las pruebas.
name: CI

on:
  push:
    branches: [develop, "feature/**"]   # en main lo ejecuta deploy.yml antes de publicar
  pull_request:
    branches: [main, develop]
  workflow_call:   # el pipeline de despliegue lo reutiliza como primera etapa

permissions:
  contents: read

jobs:
  lint:
    name: Estilo de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --output-format=github

  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      # ubuntu-latest trae Google Chrome, así que la prueba de Selenium también se ejecuta
      - name: Ejecutar pytest
        run: pytest --junitxml=reporte-pruebas.xml
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas-py${{ matrix.python }}
          path: reporte-pruebas.xml
