# Despliegue continuo: todo lo que llega a main se prueba, se construye y se publica en GitHub Pages.
name: CD - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Integración continua
    uses: ./.github/workflows/ci.yml

  construir:
    name: Construir tablero
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar sitio estático
        run: python scraping/generar_sitio.py --salida public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  desplegar:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: construir
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
